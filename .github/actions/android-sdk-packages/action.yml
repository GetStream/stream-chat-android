name: Android SDK packages
description: >-
  Installs the SDK packages reactivecircus/android-emulator-runner would download, with retries,
  and returns the cache key of an AVD made from them. The action downloads the emulator and the
  system image on every run and doesn't retry: a corrupted download ("Error reading Zip content
  from a SeekableByteChannel") fails the job before the emulator boots. sdkmanager skips packages
  that are installed and current, so the action's own install becomes a no-op.
inputs:
  api-level:
    description: The system image API level, as passed to android-emulator-runner
    required: true
  target:
    description: The system image target, as passed to android-emulator-runner
    required: false
    default: default
  profile:
    description: The hardware profile, as passed to android-emulator-runner (part of the AVD key)
    required: false
    default: ""
  cores:
    description: The emulator's cores, as passed to android-emulator-runner (part of the AVD key)
    required: false
    default: "2"
  emulator-options:
    description: The emulator options a snapshot is saved and loaded with (part of the AVD key)
    required: false
    default: ""
outputs:
  avd-key:
    description: >-
      Cache key of an AVD with a quick-boot snapshot. A snapshot only loads into the emulator
      build, system image and hardware config that saved it, so all of them are in the key.
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - name: Install the emulator and the system image
      shell: bash
      env:
        API_LEVEL: ${{ inputs.api-level }}
        TARGET: ${{ inputs.target }}
      run: |
        sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        packages=(emulator platform-tools "platforms;android-$API_LEVEL" "system-images;android-$API_LEVEL;$TARGET;x86_64")
        yes | "$sdkmanager" --licenses > /dev/null || true
        for attempt in 1 2 3; do
          "$sdkmanager" --install "${packages[@]}" --channel=0 > /dev/null && exit 0
          echo "::warning::sdkmanager failed (attempt $attempt of 3); retrying in 30 s"
          sleep 30
        done
        echo "::error::Could not install ${packages[*]}"
        exit 1
    - name: AVD cache key
      id: key
      shell: bash
      env:
        API_LEVEL: ${{ inputs.api-level }}
        TARGET: ${{ inputs.target }}
        PROFILE: ${{ inputs.profile }}
        CORES: ${{ inputs.cores }}
        OPTIONS: ${{ inputs.emulator-options }}
      run: |
        revision() { sed -n 's/^Pkg\.Revision=//p' "$1" | tr -d '\r'; }
        emulator=$(revision "$ANDROID_HOME/emulator/source.properties")
        image=$(revision "$ANDROID_HOME/system-images/android-$API_LEVEL/$TARGET/x86_64/source.properties")
        config=$(printf '%s|%s|%s' "$PROFILE" "$CORES" "$OPTIONS" | sha1sum | cut -c1-8)
        echo "key=avd-$API_LEVEL-$TARGET-x86_64-emu$emulator-img$image-$config" >> "$GITHUB_OUTPUT"
