name: Android SDK packages
description: >-
  Defines the E2E emulator, installs the SDK packages reactivecircus/android-emulator-runner would
  download, with retries, and returns the emulator config and the cache key of an AVD made from it.
  The action downloads the emulator and the system image on every run and doesn't retry: a corrupted
  download ("Error reading Zip content from a SeekableByteChannel") fails the job before the
  emulator boots. sdkmanager skips packages that are installed and current, so the action's own
  install becomes a no-op.
inputs:
  api-level:
    description: Overrides the default system image API level
    required: false
    default: ""
outputs:
  api-level:
    description: The system image API level, for android-emulator-runner
    value: ${{ steps.config.outputs.api-level }}
  target:
    description: The system image target, for android-emulator-runner
    value: ${{ steps.config.outputs.target }}
  profile:
    description: The hardware profile, for android-emulator-runner
    value: ${{ steps.config.outputs.profile }}
  cores:
    description: The emulator's cores, for android-emulator-runner
    value: ${{ steps.config.outputs.cores }}
  emulator-options:
    description: The options the snapshot is saved and loaded with, for android-emulator-runner
    value: ${{ steps.config.outputs.emulator-options }}
  avd-key:
    description: >-
      Cache key of an AVD with a quick-boot snapshot: a snapshot only loads into the emulator, image
      and hardware config that saved it.
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    # The emulator the E2E batches run on and the snapshot is saved for. One place, so the batches and
    # the job that saves the snapshot can't drift apart and silently miss it. Not the ATD image
    # (aosp_atd): it has no system file picker, and the attachment, push notification and
    # app-in-background tests fail on it.
    - name: Emulator config
      id: config
      shell: bash
      env:
        API_LEVEL: ${{ inputs.api-level || '36' }}
      run: |
        {
          echo "api-level=$API_LEVEL"
          echo "target=default"
          echo "profile=pixel"
          echo "cores=4"
          echo "emulator-options=-no-window -no-audio -no-boot-anim -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none"
        } >> "$GITHUB_OUTPUT"
    - name: Install the emulator and the system image
      shell: bash
      env:
        API_LEVEL: ${{ steps.config.outputs.api-level }}
        TARGET: ${{ steps.config.outputs.target }}
      run: |
        sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        packages=(emulator platform-tools "platforms;android-$API_LEVEL" "system-images;android-$API_LEVEL;$TARGET;x86_64")
        yes | "$sdkmanager" --licenses > /dev/null || true
        for attempt in 1 2 3; do
          "$sdkmanager" --install "${packages[@]}" --channel=0 > /dev/null && exit 0
          echo "::warning::sdkmanager failed (attempt $attempt of 3); retrying in 30 s"
          sleep 30
        done
        echo "::error::Could not install ${packages[*]}"
        exit 1
    - name: AVD cache key
      id: key
      shell: bash
      env:
        API_LEVEL: ${{ steps.config.outputs.api-level }}
        TARGET: ${{ steps.config.outputs.target }}
        PROFILE: ${{ steps.config.outputs.profile }}
        CORES: ${{ steps.config.outputs.cores }}
        OPTIONS: ${{ steps.config.outputs.emulator-options }}
      run: |
        revision() { sed -n 's/^Pkg\.Revision=//p' "$1" | tr -d '\r'; }
        emulator=$(revision "$ANDROID_HOME/emulator/source.properties")
        image=$(revision "$ANDROID_HOME/system-images/android-$API_LEVEL/$TARGET/x86_64/source.properties")
        config=$(printf '%s|%s|%s' "$PROFILE" "$CORES" "$OPTIONS" | sha256sum | cut -c1-8)
        echo "key=avd-$API_LEVEL-$TARGET-x86_64-emu$emulator-img$image-$config" >> "$GITHUB_OUTPUT"
