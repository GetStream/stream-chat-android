name: E2E Tests Nightly

on:
  schedule:
    # Runs "At 01:00 every night except weekends"
    - cron: '0 1 * * 1-5'

  workflow_dispatch:
    inputs:
      mock_server_branch:
        description: 'Mock server branch'
        type: string
        required: true
        default: main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_CACHE_AWS_REGION: ${{ secrets.BUILD_CACHE_AWS_REGION }}
  BUILD_CACHE_AWS_BUCKET: ${{ secrets.BUILD_CACHE_AWS_BUCKET }}
  BUILD_CACHE_AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_AWS_ACCESS_KEY_ID }}
  BUILD_CACHE_AWS_SECRET_KEY: ${{ secrets.BUILD_CACHE_AWS_SECRET_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  E2E_BATCH_COUNT: 4

jobs:
  build-compose-apks:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    name: Build
    uses: ./.github/workflows/e2e-build.yml
    with:
      app: compose
  build-compose-apks-coverage:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    name: Build
    uses: ./.github/workflows/e2e-build.yml
    with:
      app: compose
      coverage: true
  allure_testops_launch:
    permissions:
      contents: read
    name: Launch Allure TestOps
    runs-on: ubuntu-24.04
    outputs:
      launch_ids: ${{ steps.launch.outputs.launch_ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: GetStream/android-ci-actions/actions/setup-ruby@main
      # One launch per API level of the test matrix, shared by its batches.
      - name: Launch Allure TestOps
        id: launch
        run: bundle exec fastlane allure_launches api_levels:36,34,31,28
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
  run-compose-tests-nightly:
    permissions:
      actions: read
      contents: read
    name: Test compose
    runs-on: ubuntu-24.04
    needs:
      - build-compose-apks
      - build-compose-apks-coverage
      - allure_testops_launch
    strategy:
      matrix:
        android_api_level: [36, 34, 31, 28]
        # A full run on one emulator takes over 1.5 hours, and the runners of jobs that long kept getting shut
        # down before the end. Keep the batch count in sync with E2E_BATCH_COUNT.
        batch: [0, 1, 2, 3]
        include:
          - android_api_level: 36
            coverage: true # builds the map that selects e2e tests on pull requests
      fail-fast: false
    env:
      ANDROID_API_LEVEL: ${{ matrix.android_api_level }}
      LAUNCH_ID: ${{ fromJson(needs.allure_testops_launch.outputs.launch_ids)[format('{0}', matrix.android_api_level)] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          name: ${{ matrix.coverage && 'apks-coverage' || 'apks' }}
      - uses: GetStream/android-ci-actions/actions/setup-java@cb46e4f44d105a68738bfd2a1cfd156bb768665b
      - uses: GetStream/android-ci-actions/actions/enable-kvm@main
      - uses: GetStream/android-ci-actions/actions/setup-ruby@main
      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 60
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          disable-animations: true
          profile: pixel
          arch : x86_64
          emulator-options: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bundle exec fastlane run_e2e_test batch:${{ matrix.batch }} batch_count:${{ env.E2E_BATCH_COUNT }} mock_server_branch:${{ inputs.mock_server_branch }} coverage:${{ matrix.coverage == true }}
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ matrix.coverage && (success() || failure()) }}
        with:
          name: e2e-coverage-batch-${{ matrix.batch }}
          path: fastlane/test_output/e2e_coverage
          retention-days: 1
      - name: Allure TestOps Upload
        run: bundle exec fastlane allure_upload
        if: success() || failure()
        timeout-minutes: 10
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          LAUNCH_ID: ${{ env.LAUNCH_ID }}
      - name: Allure TestOps Launch Removal
        run: bundle exec fastlane allure_launch_removal
        if: cancelled()
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          LAUNCH_ID: ${{ env.LAUNCH_ID }}
      - name: Upload test results
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: logs_${{ env.ANDROID_API_LEVEL }}_${{ matrix.batch }}
          # The allure results carry the retry rule's failure artifacts (logcat,
          # screenshot, hierarchy per failed attempt), which TestOps deduplicates
          # away when the same test passes on another API level.
          path: |
            fastlane/stream-chat-test-mock-server/logs/*
            fastlane/allure-results/*
  build-e2e-coverage-map:
    permissions:
      actions: write # reads the previous e2e coverage map
      contents: read
    name: Build E2E coverage map
    runs-on: ubuntu-24.04
    needs: run-compose-tests-nightly
    # Failed tests still collect coverage, and keep their previous one in the map.
    if: ${{ !cancelled() && needs.run-compose-tests-nightly.result != 'skipped' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: e2e-classes
      # No batch may have collected coverage, the lane then keeps the previous map.
      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          pattern: e2e-coverage-batch-*
          path: fastlane/test_output/e2e_coverage
      - uses: GetStream/android-ci-actions/actions/setup-java@cb46e4f44d105a68738bfd2a1cfd156bb768665b
      - uses: GetStream/android-ci-actions/actions/setup-ruby@main
      - name: Build coverage map
        run: bundle exec fastlane build_e2e_coverage_map batch_count:${{ env.E2E_BATCH_COUNT }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-coverage-map
          path: fastlane/test_output/e2e_coverage_map.json
          if-no-files-found: ignore
          retention-days: 14
  slack:
    permissions:
      actions: write
      contents: read
    name: Slack Report
    runs-on: ubuntu-latest
    needs: [build-compose-apks, build-compose-apks-coverage, allure_testops_launch, run-compose-tests-nightly, build-e2e-coverage-map]
    if: failure() && github.event_name == 'schedule'
    steps:
      - uses: 8398a7/action-slack@v3
        with:
          status: cancelled
          text: "You shall not pass!"
          job_name: "${{ github.workflow }}: ${{ github.job }}"
          fields: repo,commit,author,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_NIGHTLY_CHECKS }}
