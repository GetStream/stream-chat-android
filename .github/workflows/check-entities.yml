name: Check DB Entities

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-db-entities:
    name: Check DB Entities
    runs-on: ubuntu-22.04
    outputs:
      touched: ${{ steps.touchedEntities.outcome == 'failure' }}
      entities: ${{ steps.touchedEntities.outputs.touchedEntities }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: GetStream/android-ci-actions/actions/setup-java@main
      - name: Find touched DB Entities
        id: touchedEntities
        continue-on-error: true
        run: |
          status=$(grep '@Entity' -rinl . | xargs -r git diff-index --name-only --exit-code --output=touchedEntities origin/${{ github.base_ref }} $(); echo $?)
          output=$(cat touchedEntities)
          output="${output//'%'/'%25'}"
          output="${output//$'\n'/'%0A'}"
          output="${output//$'\r'/'%0D'}"
          echo "$output"
          echo "touchedEntities=$output" >> "$GITHUB_OUTPUT"
          exit "$status"

  # Calls the GitHub API, and the org IP allow list only admits static-IP runners.
  # A job of its own so the pull request's code never runs on that runner.
  comment:
    name: Comment on touched DB Entities
    needs: check-db-entities
    if: ${{ needs.check-db-entities.outputs.touched == 'true' }}
    runs-on:
      group: github-public-ubuntu-static
    steps:
      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: DB Entities have been updated. Do we need to upgrade DB Version?

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            DB Entities have been updated. Do we need to upgrade DB Version?
            Modified Entities :
            ```
            ${{ needs.check-db-entities.outputs.entities }}
            ```
          edit-mode: replace
