name: SDK size checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-sdk-sizes:
    uses: GetStream/stream-build-conventions-android/.github/workflows/sdk-size-checks.yml@f1669c081bca009a0aa0978561096d32bfd156df # v1.4.0
    with:
      modules: "stream-chat-android-client stream-chat-android-ui-components stream-chat-android-compose stream-chat-android-ai-compose stream-chat-android-ai-ondevice stream-chat-android-ai-a2ui stream-chat-android-ai-openui"
      metrics-project: "stream-chat-android-metrics"
