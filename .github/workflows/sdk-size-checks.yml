name: SDK size checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-sdk-sizes:
    uses: GetStream/stream-build-conventions-android/.github/workflows/sdk-size-checks.yml@7909ff7419c9ba4dc1f9c1e81b1d16fc2eef36b6 # conventions PR 114, test only
    with:
      modules: "stream-chat-android-client stream-chat-android-ui-components stream-chat-android-compose stream-chat-android-ai-compose stream-chat-android-ai-ondevice stream-chat-android-ai-a2ui stream-chat-android-ai-openui"
      metrics-project: "stream-chat-android-metrics"
