name: E2E Cache

on:
  # Pull requests restore the newest develop snapshot, so it should come from the latest merge.
  push:
    branches:
      - develop
    paths-ignore:
      - '**/*.md'

  workflow_dispatch:

# Not shared with the nightly run's group, so the two don't cancel each other.
# A running build finishes and saves; only the newest pending push waits behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-compose-apks:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    name: Build
    uses: ./.github/workflows/e2e-build.yml
    with:
      app: compose
      cache_only: true
  # Saves the AVD with a quick-boot snapshot for the e2e-test.yml batches. Here, because a cache
  # saved by a pull request is visible to that pull request alone, and one saved on develop to all.
  android-avd:
    permissions:
      contents: read
    name: Emulator snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: GetStream/android-ci-actions/actions/enable-kvm@main
      - uses: ./.github/actions/android-sdk-packages
        id: sdk
      - name: Look up the AVD
        id: avd
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.sdk.outputs.avd-key }}
          lookup-only: true
      - name: Create the AVD and its snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.sdk.outputs.api-level }}
          target: ${{ steps.sdk.outputs.target }}
          arch: x86_64
          profile: ${{ steps.sdk.outputs.profile }}
          cores: ${{ steps.sdk.outputs.cores }}
          force-avd-creation: false
          emulator-options: ${{ steps.sdk.outputs.emulator-options }}
          disable-animations: true
          # Lets dexopt finish, so the snapshot holds a settled system.
          script: |
            "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell cmd package bg-dexopt-job > /dev/null 2>&1 || true
            sleep 30
      # adb emu kill returns before the snapshot is written. On timeout, nothing is saved.
      - name: Wait for the emulator to save the snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: while pgrep -f qemu-system > /dev/null; do sleep 1; done
      - name: Save the AVD
        if: steps.avd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.sdk.outputs.avd-key }}
