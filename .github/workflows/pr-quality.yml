name: PR checklist

on:
  pull_request:
    types: [ opened, edited, synchronize, labeled, unlabeled, reopened ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checklist:
    uses: GetStream/stream-build-conventions-android/.github/workflows/pr-quality.yml@500ef3b1a9a1823213f37cf269ef409042f7c7d2 # v1.2.0
    secrets: inherit
