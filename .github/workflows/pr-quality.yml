name: PR checklist

on:
  pull_request:
    types: [ opened, edited, synchronize, labeled, unlabeled, reopened ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checklist:
    uses: GetStream/stream-build-conventions-android/.github/workflows/pr-quality.yml@1503abed19b697a6731804f2fd3ce43609922338 # v1.3.0 + #110, unreleased
    secrets: inherit
