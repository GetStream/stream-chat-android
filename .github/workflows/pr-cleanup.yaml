name: PR cleanup

on:
  schedule:
    - cron: "0 7 * * 1"  # every Monday 07:00 UTC (08:00 CET / 09:00 CEST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pr-clean-stale:
    uses: GetStream/stream-build-conventions-android/.github/workflows/pr-clean-stale.yaml@5821f7fdb8d656443b89fb0e28e219ba977cfe6a # v1.1.3
    secrets: inherit
