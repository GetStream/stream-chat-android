name: PR cleanup

on:
  schedule:
    - cron: "0 7 * * 1"  # every Monday 07:00 UTC (08:00 CET / 09:00 CEST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pr-clean-stale:
    uses: GetStream/stream-build-conventions-android/.github/workflows/pr-clean-stale.yaml@22d4bdef34d33fed0183d5c4b88c6c18e52ef145 # v1.2.1
    secrets: inherit
