name: PR cleanup

on:
  schedule:
    - cron: "0 7 * * 1"  # every Monday 07:00 UTC (08:00 CET / 09:00 CEST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pr-clean-stale:
    uses: GetStream/stream-build-conventions-android/.github/workflows/pr-clean-stale.yaml@75cf8105224a5fb02ad06fb4cc52b1a45a71d440 # v1.3.1
    secrets: inherit
