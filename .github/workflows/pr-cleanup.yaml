    - cron: "0 7 * * 1"  # every Monday 07:00 UTC (08:00 CET / 09:00 CEST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pr-clean-stale:
    uses: GetStream/stream-build-conventions-android/.github/workflows/pr-clean-stale.yaml@19665cfdb1c4290d133028844708e71c15104e87 # v1.3.0
    secrets: inherit
