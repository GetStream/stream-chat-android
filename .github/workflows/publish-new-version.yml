name: Publish New Version

on:
  workflow_dispatch:
    inputs:
      bump:
        required: true
        type: choice
        description: "Type of version bump to perform"
        options:
          - patch
          - minor
          - major
        default: minor
      suffix:
        description: 'Optional version suffix (e.g. beta, rc01). A dash is added automatically.'
        required: false
        type: string
        default: ''
      publish-targets:
        description: >-
          Leave as-is. central is a manual escape hatch for a release that has to
          go out when the Stream repository cannot take it.
        required: false
        type: choice
        options:
          - streamRepo
          - streamRepo,central
          - central
        default: streamRepo

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pre_release_check:
    name: Pre release check
    runs-on: ubuntu-24.04
    environment: 'publish'
    steps:
      - name: Check
        id: pre_release_check_step
        run: echo "Pre release check"
  publish:
    permissions:
      contents: write
    needs: pre_release_check
    uses: GetStream/stream-build-conventions-android/.github/workflows/release.yml@v1.0.1
    with:
      bump: ${{ inputs.bump }}
      suffix: ${{ inputs.suffix }}
      publish-targets: ${{ inputs.publish-targets }}
    secrets:
      github-token: ${{ secrets.STREAM_PUBLIC_BOT_TOKEN }}
      maven-central-username: ${{ secrets.OSSRH_USERNAME }}
      maven-central-password: ${{ secrets.OSSRH_PASSWORD }}
      signing-key: ${{ secrets.SIGNING_KEY }}
      signing-key-id: ${{ secrets.SIGNING_KEY_ID }}
      signing-key-password: ${{ secrets.SIGNING_PASSWORD }}
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_ANDROID_CICD }}
      stream-repo-endpoint: ${{ secrets.STREAM_REPO_ENDPOINT }}
      stream-repo-bucket: ${{ secrets.STREAM_REPO_BUCKET }}
      stream-repo-access-key-id: ${{ secrets.STREAM_REPO_ACCESS_KEY_ID }}
      stream-repo-secret-access-key: ${{ secrets.STREAM_REPO_SECRET_ACCESS_KEY }}

  # Customers need one line of setup to see a version that is not on Central,
  # so say so at the top of the release, above the generated "What's Changed".
  # A separate job because the release is created inside the reusable workflow.
  release-notes-header:
    needs: publish
    if: ${{ inputs.publish-targets == 'streamRepo' }}
    name: Add the Stream repository card to the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prepend the card
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The release concurrency group means the newest release is this run's.
          TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')

          cat > card.md <<EOF
          > [!IMPORTANT]
          > **\`$TAG\` is published to the Stream Maven repository, not Maven Central.**
          >
          > \`\`\`kotlin
          > // settings.gradle.kts
          > dependencyResolutionManagement {
          >     repositories {
          >         google()
          >         mavenCentral()
          >         maven("https://stream-io-repo.com")
          >     }
          > }
          > \`\`\`

          EOF

          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          cat card.md notes.md > body.md
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file body.md
