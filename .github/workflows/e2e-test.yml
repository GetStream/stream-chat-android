name: E2E Tests

on:
  pull_request:

  workflow_dispatch:
    inputs:
      mock_server_branch:
        description: 'Mock server branch'
        type: string
        required: true
        default: main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_CACHE_AWS_REGION: ${{ secrets.BUILD_CACHE_AWS_REGION }}
  BUILD_CACHE_AWS_BUCKET: ${{ secrets.BUILD_CACHE_AWS_BUCKET }}
  BUILD_CACHE_AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_AWS_ACCESS_KEY_ID }}
  BUILD_CACHE_AWS_SECRET_KEY: ${{ secrets.BUILD_CACHE_AWS_SECRET_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_PR_NUM: ${{ github.event.pull_request.number }}

jobs:
  # Calls the GitHub API, and the org IP allow list only admits static-IP runners.
  # A job of its own so the Gradle build stays off that runner. Skipped for forks, whose code
  # must not run from an address the allow list trusts; their pull requests run every test.
  e2e-scope:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Scope
    runs-on: { group: github-public-amd64 }
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: GetStream/android-ci-actions/actions/setup-ruby@main
      - name: Decide whether the e2e tests run
        id: scope
        run: bundle exec fastlane e2e_scope

  build-compose-apks:
    name: Build
    uses: ./.github/workflows/e2e-build.yml
    with:
      app: compose
    secrets: inherit

  allure_testops_launch:
    name: Launch Allure TestOps
    runs-on: { group: github-public-amd64 }
    needs:
      - e2e-scope
      - build-compose-apks
    if: ${{ !cancelled() && needs.e2e-scope.result != 'failure' && needs.build-compose-apks.result == 'success' }}
    env:
      E2E_REQUIRED: ${{ needs.e2e-scope.outputs.required || 'true' }}
    outputs:
      launch_id: ${{ env.LAUNCH_ID }}
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: GetStream/android-ci-actions/actions/setup-ruby@main
      - uses: GetStream/android-ci-actions/actions/allure-launch@main
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          allure-token: ${{ secrets.ALLURE_TOKEN }}

  run-compose-tests:
    name: Test compose
    runs-on: { group: github-public-amd64 }
    needs:
      - e2e-scope
      - build-compose-apks
      - allure_testops_launch
    if: ${{ !cancelled() && needs.allure_testops_launch.result == 'success' }}
    strategy:
      matrix:
        include:
          - batch: 0
          - batch: 1
          - batch: 2
      fail-fast: false
    env:
      ANDROID_API_LEVEL: 34
      LAUNCH_ID: ${{ needs.allure_testops_launch.outputs.launch_id }}
      E2E_REQUIRED: ${{ needs.e2e-scope.outputs.required || 'true' }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4.1.8
        continue-on-error: true
        with:
          name: apks
      - uses: GetStream/android-ci-actions/actions/setup-java@main
      - uses: GetStream/android-ci-actions/actions/enable-kvm@main
      - uses: GetStream/android-ci-actions/actions/setup-ruby@main
      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 45
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          disable-animations: true
          profile: pixel
          arch : x86_64
          emulator-options: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bundle exec fastlane run_e2e_test batch:${{ matrix.batch }} batch_count:${{ strategy.job-total }} mock_server_branch:${{ inputs.mock_server_branch }}
      - name: Allure TestOps Upload
        if: ${{ env.LAUNCH_ID != '' && (success() || failure()) }}
        run: bundle exec fastlane allure_upload
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          LAUNCH_ID: ${{ env.LAUNCH_ID }}
      - name: Allure TestOps Launch Removal
        if: ${{ env.LAUNCH_ID != '' && cancelled() }}
        run: bundle exec fastlane allure_launch_removal
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          LAUNCH_ID: ${{ env.LAUNCH_ID }}
      - name: Upload test results
        uses: actions/upload-artifact@v4.4.3
        if: failure()
        timeout-minutes: 10
        with:
          name: logs_${{ matrix.batch }}
          path: fastlane/stream-chat-test-mock-server/logs/*
