name: E2E Tests

on:
  pull_request:
  merge_group:

  workflow_dispatch:
    inputs:
      mock_server_branch:
        description: 'Mock server branch'
        type: string
        required: true
        default: main
      api_level:
        description: 'Android API level to run on'
        type: string
        required: false
        default: '36'
      test_class:
        description: 'Fully qualified test class to run on its own. Every batch job then runs it, giving independent samples of a flaky test.'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The emulator. Keep in sync with the android-avd job in e2e-cache.yml, which saves the snapshot
  # the batches boot from. Not the ATD image (aosp_atd): it has no system file picker, and the
  # attachment, push notification and app-in-background tests fail on it.
  ANDROID_API_LEVEL: ${{ inputs.api_level || '36' }}
  ANDROID_TARGET: default
  ANDROID_PROFILE: pixel
  ANDROID_CORES: '4'
  ANDROID_EMULATOR_OPTIONS: -no-window -no-audio -no-boot-anim -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none
  BUILD_CACHE_AWS_REGION: ${{ secrets.BUILD_CACHE_AWS_REGION }}
  BUILD_CACHE_AWS_BUCKET: ${{ secrets.BUILD_CACHE_AWS_BUCKET }}
  BUILD_CACHE_AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_AWS_ACCESS_KEY_ID }}
  BUILD_CACHE_AWS_SECRET_KEY: ${{ secrets.BUILD_CACHE_AWS_SECRET_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_PR_NUM: ${{ github.event.pull_request.number }}

jobs:
  build-compose-apks:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    name: Build
    uses: ./.github/workflows/e2e-build.yml
    with:
      app: compose
    secrets: inherit
  allure_testops_launch:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    name: Launch Allure TestOps
    runs-on: ubuntu-24.04
    needs: build-compose-apks
    if: ${{ needs.build-compose-apks.outputs.e2e_batches != '[]' }}
    outputs:
      launch_id: ${{ env.LAUNCH_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: GetStream/android-ci-actions/actions/setup-ruby@main
      - uses: GetStream/android-ci-actions/actions/allure-launch@main
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          allure-token: ${{ secrets.ALLURE_TOKEN }}
  run-compose-tests:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    name: Test compose
    runs-on: ubuntu-24.04
    needs:
      - build-compose-apks
      - allure_testops_launch
    if: ${{ needs.build-compose-apks.outputs.e2e_batches != '[]' }}
    strategy:
      matrix:
        # Only the batches the tests this pull request can affect need, see the select_e2e_tests lane.
        batch: ${{ fromJson(needs.build-compose-apks.outputs.e2e_batches) }}
      fail-fast: false
    env:
      LAUNCH_ID: ${{ needs.allure_testops_launch.outputs.launch_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          name: apks
      - uses: actions/download-artifact@v8.0.2
        with:
          name: e2e-selection
          path: fastlane/test_output
      - uses: GetStream/android-ci-actions/actions/setup-java@cb46e4f44d105a68738bfd2a1cfd156bb768665b
      - uses: GetStream/android-ci-actions/actions/enable-kvm@main
      - uses: GetStream/android-ci-actions/actions/setup-ruby@main
      # Saved by e2e-cache.yml on develop. A miss (e.g. after an emulator update) cold boots as before.
      - uses: ./.github/actions/android-sdk-packages
        id: sdk
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          profile: ${{ env.ANDROID_PROFILE }}
          cores: ${{ env.ANDROID_CORES }}
          emulator-options: ${{ env.ANDROID_EMULATOR_OPTIONS }}
      - name: Restore the AVD
        id: avd
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.sdk.outputs.avd-key }}
      - name: Run tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 45
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          disable-animations: true
          profile: ${{ env.ANDROID_PROFILE }}
          cores: ${{ env.ANDROID_CORES }}
          arch : x86_64
          force-avd-creation: ${{ steps.avd.outputs.cache-hit != 'true' }}
          emulator-options: -no-snapshot-save ${{ env.ANDROID_EMULATOR_OPTIONS }}
          script: bundle exec fastlane run_e2e_test batch:${{ matrix.batch }} batch_count:${{ strategy.job-total }} mock_server_branch:${{ inputs.mock_server_branch }} ${{ inputs.test_class && format('test_class:{0}', inputs.test_class) || '' }}
      - name: Allure TestOps Upload
        if: ${{ env.LAUNCH_ID != '' && (success() || failure()) }}
        run: bundle exec fastlane allure_upload
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          LAUNCH_ID: ${{ env.LAUNCH_ID }}
      - name: Allure TestOps Launch Removal
        if: ${{ env.LAUNCH_ID != '' && cancelled() }}
        run: bundle exec fastlane allure_launch_removal
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          LAUNCH_ID: ${{ env.LAUNCH_ID }}
      - name: Upload test results
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        timeout-minutes: 10
        with:
          name: logs_${{ matrix.batch }}
          # The allure results carry the retry rule's failure artifacts (logcat,
          # screenshot, hierarchy per failed attempt), which TestOps deduplicates
          # away when the same test passes in another batch.
          path: |
            fastlane/stream-chat-test-mock-server/logs/*
            fastlane/allure-results/*
  # The single required check for E2E, so the shard count can change without touching branch
  # protection.
  e2e-result:
    name: E2E result
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs:
      - build-compose-apks
      - allure_testops_launch
      - run-compose-tests
    permissions: {}
    steps:
      - name: Fail if an E2E job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
