name: E2E Tests

on:
  pull_request:
  merge_group:

  workflow_dispatch:
    inputs:
      mock_server_branch:
        description: 'Mock server branch'
        type: string
        required: true
        default: main
      api_level:
        description: 'Android API level to run on'
        type: string
        required: false
        default: '36'
      test_class:
        description: 'Fully qualified test class to run on its own. Every batch job then runs it, giving independent samples of a flaky test.'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The emulator, shared by the snapshot job and the test batches. Not the ATD image (aosp_atd), as
  # in the React Native and Flutter SDKs: it ships without the system file picker, and the attachment,
  # push notification and app-in-background tests fail on it (21 tests on API 36).
  ANDROID_API_LEVEL: ${{ inputs.api_level || '36' }}
  ANDROID_TARGET: default
  ANDROID_PROFILE: pixel
  ANDROID_CORES: '4'
  # -no-metrics answers the metrics prompt a future emulator release will block on. The test
  # batches add -no-snapshot-save, so every batch boots from the same clean snapshot; the snapshot
  # job leaves it out, so the emulator saves one on exit.
  ANDROID_EMULATOR_OPTIONS: -no-window -no-audio -no-boot-anim -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none
  BUILD_CACHE_AWS_REGION: ${{ secrets.BUILD_CACHE_AWS_REGION }}
  BUILD_CACHE_AWS_BUCKET: ${{ secrets.BUILD_CACHE_AWS_BUCKET }}
  BUILD_CACHE_AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_AWS_ACCESS_KEY_ID }}
  BUILD_CACHE_AWS_SECRET_KEY: ${{ secrets.BUILD_CACHE_AWS_SECRET_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_PR_NUM: ${{ github.event.pull_request.number }}

jobs:
  build-compose-apks:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    name: Build
    uses: ./.github/workflows/e2e-build.yml
    with:
      app: compose
    secrets: inherit
  allure_testops_launch:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    name: Launch Allure TestOps
    runs-on: ubuntu-24.04
    needs: build-compose-apks
    if: ${{ needs.build-compose-apks.outputs.e2e_batches != '[]' }}
    outputs:
      launch_id: ${{ env.LAUNCH_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: GetStream/android-ci-actions/actions/setup-ruby@main
      - uses: GetStream/android-ci-actions/actions/allure-launch@main
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          allure-token: ${{ secrets.ALLURE_TOKEN }}
  # Boots the emulator once, lets it settle and caches the AVD with its quick-boot snapshot, while
  # the APKs build. The test batches restore it and boot from the snapshot instead of cold booting.
  android-avd:
    permissions:
      contents: read
    name: Emulator snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: GetStream/android-ci-actions/actions/enable-kvm@main
      - uses: ./.github/actions/android-sdk-packages
        id: sdk
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          profile: ${{ env.ANDROID_PROFILE }}
          cores: ${{ env.ANDROID_CORES }}
          emulator-options: ${{ env.ANDROID_EMULATOR_OPTIONS }}
      - name: Look up the AVD
        id: avd
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.sdk.outputs.avd-key }}
          lookup-only: true
      - name: Create the AVD and its snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: x86_64
          profile: ${{ env.ANDROID_PROFILE }}
          cores: ${{ env.ANDROID_CORES }}
          force-avd-creation: false
          emulator-options: ${{ env.ANDROID_EMULATOR_OPTIONS }}
          disable-animations: true
          # Lets the post-boot work (dexopt) finish, so the snapshot holds a settled system. Each line
          # runs on its own.
          script: |
            "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell cmd package bg-dexopt-job > /dev/null 2>&1 || true
            sleep 30
      # adb emu kill returns before the emulator has written the snapshot. If it hasn't exited in
      # 3 minutes, the step fails and the AVD isn't saved, so no batch restores a partial snapshot.
      - name: Wait for the emulator to save the snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: while pgrep -f qemu-system > /dev/null; do sleep 1; done
      - name: Save the AVD
        if: steps.avd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.sdk.outputs.avd-key }}
  run-compose-tests:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    name: Test compose
    runs-on: ubuntu-24.04
    needs:
      - build-compose-apks
      - allure_testops_launch
      - android-avd
    # Doesn't depend on android-avd succeeding: without a snapshot, a batch cold boots as before.
    if: ${{ !cancelled() && needs.build-compose-apks.result == 'success' && needs.allure_testops_launch.result == 'success' && needs.build-compose-apks.outputs.e2e_batches != '[]' }}
    strategy:
      matrix:
        # Only the batches the tests this pull request can affect need, see the select_e2e_tests lane.
        batch: ${{ fromJson(needs.build-compose-apks.outputs.e2e_batches) }}
      fail-fast: false
    env:
      LAUNCH_ID: ${{ needs.allure_testops_launch.outputs.launch_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          name: apks
      - uses: actions/download-artifact@v8.0.2
        with:
          name: e2e-selection
          path: fastlane/test_output
      - uses: GetStream/android-ci-actions/actions/setup-java@cb46e4f44d105a68738bfd2a1cfd156bb768665b
      - uses: GetStream/android-ci-actions/actions/enable-kvm@main
      - uses: GetStream/android-ci-actions/actions/setup-ruby@main
      # The key comes from this runner's own installs: if the emulator was updated since android-avd
      # ran, the lookup misses and the batch cold boots instead of loading a stale snapshot.
      - uses: ./.github/actions/android-sdk-packages
        id: sdk
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          profile: ${{ env.ANDROID_PROFILE }}
          cores: ${{ env.ANDROID_CORES }}
          emulator-options: ${{ env.ANDROID_EMULATOR_OPTIONS }}
      - name: Restore the AVD
        id: avd
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.sdk.outputs.avd-key }}
      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 45
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          disable-animations: true
          profile: ${{ env.ANDROID_PROFILE }}
          cores: ${{ env.ANDROID_CORES }}
          arch : x86_64
          # Reuses a restored AVD and its snapshot; creates one when there is none.
          force-avd-creation: ${{ steps.avd.outputs.cache-hit != 'true' }}
          emulator-options: -no-snapshot-save ${{ env.ANDROID_EMULATOR_OPTIONS }}
          script: bundle exec fastlane run_e2e_test batch:${{ matrix.batch }} batch_count:${{ strategy.job-total }} mock_server_branch:${{ inputs.mock_server_branch }} ${{ inputs.test_class && format('test_class:{0}', inputs.test_class) || '' }}
      - name: Allure TestOps Upload
        if: ${{ env.LAUNCH_ID != '' && (success() || failure()) }}
        run: bundle exec fastlane allure_upload
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          LAUNCH_ID: ${{ env.LAUNCH_ID }}
      - name: Allure TestOps Launch Removal
        if: ${{ env.LAUNCH_ID != '' && cancelled() }}
        run: bundle exec fastlane allure_launch_removal
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          LAUNCH_ID: ${{ env.LAUNCH_ID }}
      - name: Upload test results
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        timeout-minutes: 10
        with:
          name: logs_${{ matrix.batch }}
          # The allure results carry the retry rule's failure artifacts (logcat,
          # screenshot, hierarchy per failed attempt), which TestOps deduplicates
          # away when the same test passes in another batch.
          path: |
            fastlane/stream-chat-test-mock-server/logs/*
            fastlane/allure-results/*
  # The single required check for E2E, so the shard count can change without touching branch
  # protection.
  e2e-result:
    name: E2E result
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs:
      - build-compose-apks
      - allure_testops_launch
      - run-compose-tests
    permissions: {}
    steps:
      - name: Fail if an E2E job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
