name: Pull request CI checks

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-android-ci:
    permissions:
      contents: read
      pull-requests: read
    uses: GetStream/stream-build-conventions-android/.github/workflows/android-ci.yml@75cf8105224a5fb02ad06fb4cc52b1a45a71d440 # v1.3.1
    secrets:
      BUILD_CACHE_AWS_REGION: ${{ secrets.BUILD_CACHE_AWS_REGION }}
      BUILD_CACHE_AWS_BUCKET: ${{ secrets.BUILD_CACHE_AWS_BUCKET }}
      BUILD_CACHE_AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_AWS_ACCESS_KEY_ID }}
      BUILD_CACHE_AWS_SECRET_KEY: ${{ secrets.BUILD_CACHE_AWS_SECRET_KEY }}
  detekt:
    permissions:
      contents: read
      pull-requests: read
    name: Detekt
    runs-on: { group: github-public-amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: GetStream/stream-build-conventions-android/.github/actions/setup-gradle@75cf8105224a5fb02ad06fb4cc52b1a45a71d440 # v1.3.1
      - name: Detekt
        run: ./gradlew detekt
  rubocop:
    permissions:
      contents: read
      pull-requests: read
    name: Rubocop
    runs-on: { group: github-public-amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: GetStream/android-ci-actions/actions/setup-ruby@main
      - run: bundle exec fastlane rubocop
