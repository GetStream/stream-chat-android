name: Pull request CI checks

on: [ pull_request ]

concurrency:
  group: ${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  base-android-ci:
    uses: GetStream/stream-build-conventions-android/.github/workflows/android-ci.yml@1503abed19b697a6731804f2fd3ce43609922338 # v1.3.0 + #110, unreleased
    # No SONAR_TOKEN: SonarCloud can't read pull requests from GitHub, so the shared workflow skips Sonar.
    secrets:
      BUILD_CACHE_AWS_REGION: ${{ secrets.BUILD_CACHE_AWS_REGION }}
      BUILD_CACHE_AWS_BUCKET: ${{ secrets.BUILD_CACHE_AWS_BUCKET }}
      BUILD_CACHE_AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_AWS_ACCESS_KEY_ID }}
      BUILD_CACHE_AWS_SECRET_KEY: ${{ secrets.BUILD_CACHE_AWS_SECRET_KEY }}

  detekt:
    name: Detekt
    runs-on: { group: github-public-amd64 }
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: GetStream/stream-build-conventions-android/.github/actions/setup-gradle@1503abed19b697a6731804f2fd3ce43609922338 # v1.3.0 + #110, unreleased
      - name: Detekt
        run: ./gradlew detekt

  rubocop:
    name: Rubocop
    runs-on: { group: github-public-amd64 }
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: GetStream/android-ci-actions/actions/setup-ruby@main
      - run: bundle exec fastlane rubocop
