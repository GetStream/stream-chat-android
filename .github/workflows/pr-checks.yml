name: Pull request CI checks

on:
  pull_request:
  merge_group:
  # Pushes to develop also save the Gradle caches that pull requests and the merge queue restore.
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Develop runs finish so they save the Gradle caches; a newer push only replaces a queued one.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  base-android-ci:
    permissions:
      contents: read
      pull-requests: read
    uses: GetStream/stream-build-conventions-android/.github/workflows/android-ci.yml@68ae4af6c070946186d502ce5967077bd2f77cf2 # TODO pin to the release
    with:
      save-gradle-cache: true
    secrets:
      # Sonar runs only on pushes, as SonarCloud can't analyze pull requests.
      SONAR_TOKEN: ${{ github.event_name == 'push' && secrets.SONAR_TOKEN || '' }}
  detekt:
    permissions:
      contents: read
      pull-requests: read
    name: Detekt
    runs-on: { group: github-public-amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: GetStream/stream-build-conventions-android/.github/actions/setup-gradle@68ae4af6c070946186d502ce5967077bd2f77cf2 # TODO pin to the release
        with:
          cache-read-only: 'false' # TEMP test
      - name: Detekt
        run: ./gradlew detekt
  release-build:
    if: github.event_name == 'push'
    permissions:
      contents: read
    name: Release build
    runs-on: { group: github-public-amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: GetStream/stream-build-conventions-android/.github/actions/setup-gradle@68ae4af6c070946186d502ce5967077bd2f77cf2 # TODO pin to the release
      - name: Build
        run: ./gradlew assembleRelease
  remove-older-gradle-caches:
    needs: [ base-android-ci, detekt ]
    if: ${{ !cancelled() }} # TEMP test
    permissions:
      actions: write
    uses: GetStream/stream-build-conventions-android/.github/workflows/gradle-cache-cleanup.yml@68ae4af6c070946186d502ce5967077bd2f77cf2 # TODO pin to the release
  rubocop:
    permissions:
      contents: read
      pull-requests: read
    name: Rubocop
    if: github.event_name != 'push'
    runs-on: { group: github-public-amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: GetStream/android-ci-actions/actions/setup-ruby@main
      - run: bundle exec fastlane rubocop
