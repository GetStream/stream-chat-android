name: Clean Detekt Baseline Files

on:
  schedule:
    # Every midnight
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  clean_detekt_baseline_files:
    permissions:
      contents: read
    name: Clean Detekt Baseline Files
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: develop
          persist-credentials: false
      - uses: GetStream/android-ci-actions/actions/setup-java@cb46e4f44d105a68738bfd2a1cfd156bb768665b
      - name: Run Detekt Baseline
        run: ./gradlew detektBaseline
      # Minted after the build, and a PR opened with it runs CI, unlike one opened with GITHUB_TOKEN.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ vars.ANDROID_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ANDROID_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "AUTOMATION: Clean Detekt Baseline Files"
          title: "AUTOMATION: Clean Detekt Baseline Files"
          delete-branch: true
          labels: pr:ignore-for-release
          body: |
            - Clean Detekt Baseline Files

            Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
          branch: clean-detekt-baseline-files
          token: ${{ steps.generate-token.outputs.token }}
