name: Clean Detekt Baseline Files

on:
  schedule:
    # Every midnight
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  clean_detekt_baseline_files:
    permissions:
      contents: read
    name: Clean Detekt Baseline Files
    runs-on: { group: github-public-amd64 }
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      sha: ${{ steps.changes.outputs.sha }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: develop
          persist-credentials: false
      - uses: GetStream/android-ci-actions/actions/setup-java@cb46e4f44d105a68738bfd2a1cfd156bb768665b
      - name: Run Detekt Baseline
        run: ./gradlew detektBaseline
      - name: Save the baseline changes
        id: changes
        run: |
          # Intent to add, so the patch also carries baselines of modules that had none.
          git add --intent-to-add --all
          git diff --binary > detekt-baseline.patch
          if [ -s detekt-baseline.patch ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ steps.changes.outputs.changed == 'true' }}
        with:
          name: detekt-baseline-patch
          path: detekt-baseline.patch
          retention-days: 1

  # Calls the GitHub API, and the org IP allow list only admits static-IP runners.
  # A job of its own so the Gradle build stays off that runner.
  open_pull_request:
    permissions:
      contents: read
    name: Open the baseline pull request
    needs: clean_detekt_baseline_files
    if: ${{ needs.clean_detekt_baseline_files.outputs.changed == 'true' }}
    runs-on:
      group: github-public-amd64
    steps:
      # The commit the patch was made on, so a merge to develop in between can't break it.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.clean_detekt_baseline_files.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: detekt-baseline-patch
          path: ${{ runner.temp }}
      - name: Apply the baseline changes
        run: git apply "$RUNNER_TEMP/detekt-baseline.patch"
      # Minted in a job that never runs Gradle, and a PR opened with it runs CI, unlike one opened with GITHUB_TOKEN.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: generate-token
        with:
          client-id: ${{ vars.ANDROID_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ANDROID_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "AUTOMATION: Clean Detekt Baseline Files"
          title: "AUTOMATION: Clean Detekt Baseline Files"
          delete-branch: true
          labels: pr:ignore-for-release
          body: |
            - Clean Detekt Baseline Files

            Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
          branch: clean-detekt-baseline-files
          base: develop
          token: ${{ steps.generate-token.outputs.token }}
