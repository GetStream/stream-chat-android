name: E2E Build

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string

env:
  BUILD_CACHE_AWS_REGION: ${{ secrets.BUILD_CACHE_AWS_REGION }}
  BUILD_CACHE_AWS_BUCKET: ${{ secrets.BUILD_CACHE_AWS_BUCKET }}
  BUILD_CACHE_AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_AWS_ACCESS_KEY_ID }}
  BUILD_CACHE_AWS_SECRET_KEY: ${{ secrets.BUILD_CACHE_AWS_SECRET_KEY }}

jobs:
  build:
    name: ${{ inputs.app }} apks
    runs-on: { group: github-public-amd64 }
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: GetStream/android-ci-actions/actions/setup-java@main
      - uses: GetStream/android-ci-actions/actions/enable-kvm@main
      - uses: GetStream/android-ci-actions/actions/setup-ruby@main
      # Restores the cache develop saves for its E2E build. Only pushes to develop save caches.
      - name: Restore Gradle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-e2e-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gradle-e2e-
      - name: Build apks
        run: bundle exec fastlane build_e2e_test
        timeout-minutes: 30
      - name: Upload apks
        uses: actions/upload-artifact@v4.4.3
        with:
          name: apks
          path: |
            stream-chat-android-${{ inputs.app }}-sample/build/outputs/apk/e2e/debug/*.apk
            stream-chat-android-${{ inputs.app }}-sample/build/outputs/apk/androidTest/e2e/debug/*.apk
