name: Snapshot Tests

on:
  # pull_request: # FIXME: https://github.com/pedrovgs/Shot/issues/326

  workflow_dispatch:
    inputs:
      record:
        description: 'Should Snapshots be recorded on CI?'
        type: boolean
        required: false
        default: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_PR_NUM: ${{ github.event.pull_request.number }}

jobs:
  run_snapshot_tests:
    name: Run
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4.2.2
      - uses: GetStream/android-ci-actions/actions/setup-java@main
      - uses: GetStream/android-ci-actions/actions/setup-ruby@main

      - name: Snapshot tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 60
        with:
          api-level: 27
          disable-animations: true
          profile: pixel
          arch : x86_64
          emulator-options: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bundle exec fastlane run_snapshot_test record:${{ github.event.inputs.record }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4.4.3
        continue-on-error: true
        with:
          name: report
          path: ./**/build/reports/*

      - name: Save the recorded snapshots
        if: ${{ github.event.inputs.record == 'true' }}
        run: |
          git add --intent-to-add --all
          git diff --binary > snapshots.patch
      - uses: actions/upload-artifact@v4.4.3
        if: ${{ github.event.inputs.record == 'true' }}
        with:
          name: snapshots-patch
          path: snapshots.patch
          retention-days: 1

  # Calls the GitHub API, and the org IP allow list only admits static-IP runners.
  # A job of its own so the emulator run stays off that runner.
  open_pull_request:
    name: Open the snapshots pull request
    needs: run_snapshot_tests
    if: ${{ github.event.inputs.record == 'true' }}
    runs-on:
      group: github-public-ubuntu-static
    steps:
      - name: Check out code
        uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4.1.8
        with:
          name: snapshots-patch
          path: ${{ runner.temp }}
      - name: Apply the recorded snapshots
        run: |
          if [ -s "$RUNNER_TEMP/snapshots.patch" ]; then git apply "$RUNNER_TEMP/snapshots.patch"; fi
      - name: Create Pull Request
        if: ${{ github.event.inputs.record == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update screenshots"
          title: "Update screenshots"
          delete-branch: true
          reviewers: GetStream/android-developers-ui
          branch: update-screenshots
          token: ${{ secrets.GITHUB_TOKEN }}
