static Boolean gitIsAvailable() {
    try {
        "git --version".execute()
        return true
    } catch (Throwable ignored) {
        return false
    }
}
def isCI = System.getenv('CI')
def sdkVersion = version
ext["sampleAppVersionCode"] = 1
ext["sampleAppVersionName"] = version
if (isCI && gitIsAvailable()) {
    gitVersioner {
        def branches = ['develop', 'main', 'release']
        baseBranch branchName in branches ? branchName : branches[0]
        yearFactor 100
        // Firebase App Distribution already shows the version code next to the name, so the
        // name carries the two things it cannot derive: the SDK version and the commit.
        formatter = { gitVersioner ->
            "${sdkVersion}-${gitVersioner.currentSha1Short}"
        }
    }

    ext["sampleAppVersionCode"] = gitVersioner.versionCode
    ext["sampleAppVersionName"] = gitVersioner.versionName
}
