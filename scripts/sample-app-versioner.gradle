// CI passes these so that every published sample build is a distinct, newer release.
//
// The version code is minutes since a fixed epoch rather than a commit count. The same
// package is published from both develop and main, their commit counts diverge, and Android
// rejects an install whose version code went backwards.
//
// Without the properties the samples keep the fixed values they had before.
def sdkVersion = version.toString()
def buildSha = findProperty("sampleAppBuildSha")

ext["sampleAppVersionCode"] = (findProperty("sampleAppVersionCode") ?: "1") as Integer
ext["sampleAppVersionName"] = buildSha ? "$sdkVersion-$buildSha".toString() : sdkVersion
